# Nominal configuration. All units SI (m, rad, s).
# Every tunable value lives here so experiments are a config change, not a code change.

sim:
  model: models/scene.xml
  physics_dt: 0.002        # MuJoCo integration step
  control_dt: 0.05         # control / estimation rate (20 Hz)
  start_pose: [0.5, 0.5, 0.0]   # x, y, yaw in world frame
  camera_every: 4          # render the camera every N control steps (5 Hz)
  max_time: 90.0
  seed: 0

robot:                     # TurtleBot3 Burger datasheet values
  wheel_radius: 0.033
  wheel_base: 0.160        # distance between wheel contact points
  encoder_ticks_per_rev: 4096
  v_max: 0.22
  w_max: 2.84

camera:                    # mount relative to base_link, and image settings
  x: 0.07
  z: 0.12
  fovy_deg: 60.0
  width: 640
  height: 480
  intrinsics: 
    fx: 415.31
    fy: 415.33
    cx: 319.30
    cy: 239.54
    dist: [-0.0014, 0.0031, -0.0001, -0.0002, -0.0023]

lidar:                     # mount relative to base_link (scan plane parallel to the floor)
  x: -0.02
  z: 0.18
  n_beams: 72              # 5 degree resolution
  max_range: 3.5

noise:                     # imperfections the estimator does NOT know about
  encoder_tick_sigma: 1.0  # random tick error added per step, per wheel (random walk)
  wheel_scale_error: [0.002, -0.002]   # left/right effective radius error (fraction), causes drift
  lidar_sigma: 0.01
  camera_pixel_sigma: 8.0  # Gaussian image noise (grey levels)
  camera_blur_px: 0

marker:
  dictionary: DICT_4X4_50
  id: 0
  size: 0.15               # black square edge length
  pose_world: [4.84, 2.0, 3.141592653589793]   # x, y, yaw of marker face normal
  range_correction: [-0.00104, 0.00213]   # from scripts/calibrate_marker_range.py
  

obstacles:                 # used to build the scene and draw plots (not given to the robot)
  - {type: box, x: 2.0, y: 1.5, hx: 0.20, hy: 0.20}
  - {type: cylinder, x: 3.0, y: 2.8, r: 0.25}
  - {type: box, x: 3.5, y: 1.0, hx: 0.15, hy: 0.30}

waypoints:              # hand-placed to avoid the obstacles, ends in front of the dock
  - [2.6, 0.6]
  - [2.7, 2.0]
  - [4.3, 2.0]

controller:
  type: p                  # "p" = polar P controller, "lqr" = LQR tracker (can be overridden with run.py --controller)
  k_rho: 0.8               # P controller gains
  k_alpha: 2.5
  goal_tol: 0.08
  stop_distance: 0.15      # LiDAR safety stop
  lqr:                     # LQR tracker settings, see src/control/lqr.py
    Q_lqr: [30.0, 60.0, 8.0]   # weights on [e_x (m), e_y (m), e_theta (rad)] in the robot frame
    R_lqr: [4.0, 1.0]          # weights on [dv (m/s), dw (rad/s)]
    v_ref: 0.15                # cruise speed along a segment (m/s)
    v_min: 0.03                # creep speed floor while slowing into a waypoint (m/s)
    slowdown_gain: 1.0         # v_ref <= gain * distance remaining on the segment (1/s)
    v_lin_min: 0.05            # speed used to linearise when the reference is slower (m/s)
    w_turn_max: 1.5            # yaw-rate cap for in-place turns (rad/s)
    align_enter: 0.60          # heading error that triggers an in-place turn (rad)
    align_exit: 0.15           # heading error at which tracking resumes (rad)
    pos_hold: 0.30             # reference stops when position error reaches this (m)
    ang_hold: 0.80             # ... or heading error reaches this (rad)
    a_max: 0.5                 # linear acceleration limit (m/s^2); null disables
    alpha_max: 4.0             # angular acceleration limit (rad/s^2); null disables

ekf:                       # Part C. Values come from the calibration scripts, see docs/part_A_C_notes.md
  measurement_model: pose  # "pose" (default, fully observable) or "range_bearing" (rank-deficient)
  initial_sigma: [0.02, 0.02, 0.02]   # start pose known to ~2 cm / ~1 degree
  odom_q0: 8.601e-08       # m^2, per-wheel variance floor (scripts/calibrate_odometry_noise.py)
  odom_k: 4.497e-07        # m, per-wheel variance per metre travelled (consistency-scaled)
  marker_sigma:            # sigma(r) = a + b r^2, from scripts/calibrate_marker_noise.py
    x: [0.00015, 0.00549]
    y: [0.00018, 0.00112]
    yaw: [0.00166, 0.02807]
    range: [0.00016, 0.00561]
    bearing: [0.00118, 0.00000]
  R_scale: 1.0             # multiplies R; used for the R trade-off study
  gate_probability: 0.99   # chi-square gate on the NIS; null disables gating
  max_marker_range: 3.0    # m, upper end of the calibrated range
  reset_after_rejections: 5   # consecutive gate rejections before divergence recovery (0 = never)
  reset_inflation: 100.0   # P multiplier on recovery

avoidance:                 # LiDAR obstacle avoidance, see src/planning/avoidance.py
  enabled: true
  robot_radius: 0.10       # half-width of the robot incl. wheels (m)
  margin: 0.12             # extra clearance kept from obstacles (m)
  lookahead: 1.0           # obstacles further than this along the path are ignored (m)
  detour_distance: 0.5     # how far out a detour waypoint is placed (m)
  detour_reached: 0.15     # a detour counts as reached within this (m)
  max_turn_deg: 120        # widest detour direction tried, each side of the goal

docking:                   # visual docking after the last waypoint, see src/control/docking.py
  enabled: true
  stop_distance: 0.30      # target range, base_link origin to marker centre (m)
  range_tol: 0.01          # stop once a fresh detection reads within this of stop_distance (m)
  bearing_tol_deg: 10.0    # docked if the marker is then this close to the image centre
  lost_timeout: 2.0        # time without a detection before searching (s)
  search_delay: 0.5        # wait this long for a first frame before searching (s)
  search_rate: 0.4         # in-place rotation rate while searching (rad/s)
  max_time: 30.0           # docking gives up after this (s)
  lqr:                     # overrides of controller.lqr for the approach
    v_ref: 0.08
    v_min: 0.02
    slowdown_gain: 0.8
  success_range: [0.25, 0.35]   # evaluation only: judged against ground truth in evaluation/
  success_bearing_deg: 15.0
